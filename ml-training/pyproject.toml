[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-training"
version = "0.1.0"
description = "Offline training and evaluation of the anomaly detector"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# An application pins (decision D-16). telemetry-core is a path dependency
# resolved by installing it first in editable mode.
dependencies = [
    "telemetry-core==0.1.0",
    "confluent-kafka==2.6.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "pyarrow==18.1.0",
    "joblib==1.4.2",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
]

[project.optional-dependencies]
report = ["matplotlib==3.9.3"]
dev = [
    "matplotlib==3.9.3",
    "pytest>=8.0,<9.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.6,<1.0",
    "pandas-stubs>=2.2,<3.0",
]

[project.scripts]
ml-training = "ml_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ml_training = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]
# X for a design matrix is the universal convention in scikit-learn; renaming it
# would make this code harder to read for anyone who knows the library.
"src/ml_training/models/*" = ["N803", "N806"]
"src/ml_training/*" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Neither ships type information. No type from either appears in one of our
# public signatures: the pipeline is handled through our own protocols.
module = ["confluent_kafka.*", "sklearn.*", "joblib.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
