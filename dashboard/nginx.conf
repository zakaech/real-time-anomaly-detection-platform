# Serves the SPA and proxies the API, so the browser only ever sees ONE origin.
#
# That is the whole CORS answer (decision D-42): same-origin removes the problem
# rather than working around it, and it needs no change to the backend. The dev
# server does the same thing through proxy.conf.json, so development and
# production have the same shape and the code has no environment branch.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Angular routes are client-side; a deep link must return index.html rather
    # than a 404 from the filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build artefacts never change content under the same name.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Runtime configuration is rewritten at container start, so it must never be
    # cached or the container would serve yesterday's backend URL.
    location = /assets/config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # The SSE stream. Every directive here is required, and omitting any of them
    # produces the same silent failure: the connection is established, the
    # dashboard shows "connected", and no event ever arrives.
    location /api/v1/alerts/stream {
        proxy_pass         http://alert-service:8080;
        proxy_http_version 1.1;
        # nginx would otherwise buffer the response and release nothing until the
        # buffer fills -- which for a stream means never.
        proxy_buffering    off;
        proxy_cache        off;
        # Default keepalive would cut an idle stream long before the 15s
        # heartbeat could prove it alive.
        proxy_read_timeout 1h;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass       http://alert-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
