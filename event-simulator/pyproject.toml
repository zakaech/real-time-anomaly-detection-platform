[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-simulator"
version = "0.1.0"
description = "Industrial telemetry simulator producing labelled sensor streams to Kafka"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# An application pins; a library declares ranges (decision D-16). telemetry-core
# is a path dependency resolved by installing it first, in editable mode:
#   pip install -e libs/telemetry-core
#   pip install -e "event-simulator[dev]"
# pip then sees the requirement as already satisfied and does not reach out to
# an index for it.
dependencies = [
    "telemetry-core==0.1.0",
    "confluent-kafka==2.6.1",
    "numpy==2.1.3",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "PyYAML==6.0.2",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "jsonschema>=4.21,<5.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.6,<1.0",
    "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
event-simulator = "event_simulator.main:main"
telemetry-inspect = "event_simulator.tools.inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
event_simulator = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
disallow_any_unimported = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# confluent-kafka ships no type information. No confluent type ever appears in
# one of our signatures -- the producer is used through the MessageProducer
# protocol in publishing/producer.py -- so the untyped import stays contained
# to the factory that builds it.
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
