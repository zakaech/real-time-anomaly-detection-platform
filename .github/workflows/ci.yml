name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: the older result is
# already obsolete, and queueing it only delays the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetry-core:
    name: telemetry-core (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the version PySpark 3.5 supports, so a check that passes
          # here also passes in the Spark executors of step 4.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: libs/telemetry-core/pyproject.toml

      - name: Install telemetry-core with dev extras
        run: pip install -e "libs/telemetry-core[dev]"

      # The gates run in the order that fails fastest, but each one always runs
      # so a single report shows every problem instead of only the first.
      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: ruff check libs/telemetry-core

      - name: Format check (ruff)
        if: ${{ !cancelled() }}
        run: ruff format --check libs/telemetry-core

      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        working-directory: libs/telemetry-core
        run: mypy

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: libs/telemetry-core
        run: pytest -q

      # Called out separately from the suite above because these two protect
      # invariants whose failure mode is silent, not loud:
      #   - the alert identifier derivation, which makes replay idempotent;
      #   - conformance between the code and contracts/json-schema.
      # Naming them as their own step means a red build says which one broke
      # without anyone opening the log.
      - name: Contract conformance and alert-id golden test
        if: ${{ !cancelled() }}
        working-directory: libs/telemetry-core
        run: pytest -q tests/test_schema_conformance.py tests/test_ids.py

  contracts:
    name: contracts (JSON Schema validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator
        run: pip install "jsonschema>=4.21,<5.0"

      # Guards the contract files on their own, independently of the Python
      # library: a malformed schema silently validates everything, which is
      # worse than having no schema at all.
      - name: Check every schema is a valid Draft 2020-12 schema
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          failures = []
          schemas = sorted(pathlib.Path("contracts/json-schema").glob("*.json"))
          if not schemas:
              sys.exit("no contract schema found")
          for path in schemas:
              try:
                  Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
                  print(f"ok   {path}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  print(f"FAIL {path}: {exc}")
          if failures:
              sys.exit(1)
          PY

  infra:
    name: infra (compose and topic script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the committed template
        # .env is git-ignored; CI uses the template so the compose file is
        # validated with exactly the variables a developer would have.
        run: cp .env.example .env

      - name: Validate the compose file resolves
        # `config` interpolates every variable and fails on an unset one, which
        # catches a variable added to compose but forgotten in .env.example.
        run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet

      - name: Shellcheck the topic creation script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh infra/kafka/create-topics.sh
