name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: the older result is
# already obsolete, and queueing it only delays the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  telemetry-core:
    name: telemetry-core (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to the version PySpark 3.5 supports, so a check that passes
          # here also passes in the Spark executors of step 4.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: libs/telemetry-core/pyproject.toml

      - name: Install telemetry-core with dev extras
        run: pip install -e "libs/telemetry-core[dev]"

      # The gates run in the order that fails fastest, but each one always runs
      # so a single report shows every problem instead of only the first.
      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: ruff check libs/telemetry-core

      - name: Format check (ruff)
        if: ${{ !cancelled() }}
        run: ruff format --check libs/telemetry-core

      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        working-directory: libs/telemetry-core
        run: mypy

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: libs/telemetry-core
        run: pytest -q

      # Called out separately from the suite above because these two protect
      # invariants whose failure mode is silent, not loud:
      #   - the alert identifier derivation, which makes replay idempotent;
      #   - conformance between the code and contracts/json-schema.
      # Naming them as their own step means a red build says which one broke
      # without anyone opening the log.
      - name: Contract conformance and alert-id golden test
        if: ${{ !cancelled() }}
        working-directory: libs/telemetry-core
        run: pytest -q tests/test_schema_conformance.py tests/test_ids.py

  event-simulator:
    name: event-simulator (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            libs/telemetry-core/pyproject.toml
            event-simulator/pyproject.toml

      # telemetry-core first, in editable mode: pip then treats the
      # `telemetry-core` requirement as satisfied instead of looking for a
      # package that is published nowhere.
      - name: Install telemetry-core
        run: pip install -e libs/telemetry-core

      - name: Install event-simulator with dev extras
        run: pip install -e "event-simulator[dev]"

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: ruff check event-simulator

      - name: Format check (ruff)
        if: ${{ !cancelled() }}
        run: ruff format --check event-simulator

      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        working-directory: event-simulator
        run: mypy

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: event-simulator
        run: pytest -q

      # Named separately because each guards an invariant whose failure mode is
      # silent: independent RNG streams (anomalies must not perturb the noise),
      # and the ground truth never reaching the telemetry topic.
      - name: RNG independence and ground-truth separation
        if: ${{ !cancelled() }}
        working-directory: event-simulator
        run: pytest -q tests/test_rng.py tests/test_projections.py

  ml-training:
    name: ml-training (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            libs/telemetry-core/pyproject.toml
            ml-training/pyproject.toml

      - name: Install telemetry-core
        run: pip install -e libs/telemetry-core

      - name: Install ml-training with dev extras
        run: pip install -e "ml-training[dev]"

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: ruff check ml-training

      - name: Format check (ruff)
        if: ${{ !cancelled() }}
        run: ruff format --check ml-training

      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        working-directory: ml-training
        run: mypy

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: ml-training
        run: pytest -q

      # Named separately: the feature conformance test is what lets the Spark
      # job claim the same semantics, and the leakage tests guard the
      # failure that produces excellent metrics and a worthless model.
      - name: Feature conformance and label leakage
        if: ${{ !cancelled() }}
        working-directory: ml-training
        run: pytest -q tests/test_feature_conformance.py tests/test_leakage.py

  stream-processor:
    name: stream-processor (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 17, not the runner's default. PySpark 3.5 fails on Java 21 with
      # "sun.misc.Unsafe or java.nio.DirectByteBuffer.<init>(long,int) not
      # available" as soon as Arrow is used -- which the scoring path always is
      # (decision D-33). Pinning it here keeps CI on the same JVM as the image.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            libs/telemetry-core/pyproject.toml
            ml-training/pyproject.toml
            stream-processor/pyproject.toml

      - name: Install telemetry-core
        run: pip install -e libs/telemetry-core

      # ml-training is a runtime dependency, not a test convenience: the pickle
      # holds references to its classes and will not unpickle without it
      # (decision D-35).
      - name: Install ml-training
        run: pip install -e ml-training

      - name: Install stream-processor with dev extras
        run: pip install -e "stream-processor[dev]"

      - name: Lint (ruff)
        if: ${{ !cancelled() }}
        run: ruff check stream-processor

      - name: Format check (ruff)
        if: ${{ !cancelled() }}
        run: ruff format --check stream-processor

      - name: Type check (mypy, strict)
        if: ${{ !cancelled() }}
        working-directory: stream-processor
        run: mypy

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: stream-processor
        run: pytest -q

      # Named separately because each guards an invariant that fails silently:
      #   - feature conformance: Spark must compute what the model was trained
      #     on, or scoring is plausible and wrong;
      #   - artefact verification: the job must refuse an incompatible pickle
      #     rather than score with it;
      #   - maturity: windows must not be scored while still filling, which was
      #     measured flagging anomalies at ~100% against 1.0% for complete ones
      #     (D-37). A regression here is an alert storm, not a test failure.
      #   - alerting: the deduplication rules that stop one incident becoming
      #     hundreds of alerts, including the timeout-behind-watermark case that
      #     killed a real recovery run.
      # Since D-48 the artefact IS committed, so the three tests that load the
      # real binary now run here rather than skipping -- including the one that
      # flips a single byte and asserts the job refuses the pickle. The
      # rejection tests were always written to run without it.
      - name: Feature conformance, artefact verification, maturity and alert deduplication
        if: ${{ !cancelled() }}
        working-directory: stream-processor
        run: pytest -q tests/test_feature_conformance.py tests/test_model.py tests/test_maturity.py tests/test_alerting.py

  alert-service:
    name: alert-service (build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Testcontainers starts a real PostgreSQL. The runner already provides a
      # Docker daemon, and the API version the client speaks is pinned in the
      # pom so the same build works here and on a workstation running a much
      # newer Docker.
      - name: Build and test
        working-directory: alert-service
        run: mvn -B verify

      # Named separately because each guards an invariant whose failure mode is
      # silent:
      #   - idempotency: a replayed alert must not create a second row, and the
      #     guarantee has to come from PostgreSQL rather than from an if. A crash
      #     test measured 8 duplicate deliveries (docs/10), so this is not
      #     hypothetical.
      #   - error classification: a transient database failure must be retried
      #     and a corrupt payload must not, and confusing the two either loses
      #     valid alerts or blocks a partition forever.
      #   - contract conformance: the Java dead-letter envelope must match the
      #     same JSON Schema the Python components emit, or a rejected message
      #     becomes unreplayable and nobody finds out until they try.
      - name: Idempotency, error classification and contract conformance
        if: ${{ !cancelled() }}
        working-directory: alert-service
        run: mvn -B test -Dtest='AlertIdempotencyTest,AlertConsumerTest,ContractConformanceTest' -Dsurefire.failIfNoSpecifiedTests=false

      # Named separately because it guards the one failure mode documentation
      # has: describing something the code does not do. The test compares the
      # generated OpenAPI document against Spring's own routing table, in both
      # directions -- a documented path that is not routable, or a routable path
      # left undocumented, fails the build. That is the reason springdoc was
      # chosen over a hand-written openapi.yaml (decision D-50): a file nobody
      # can forget to update.
      - name: OpenAPI matches the routes that actually exist
        if: ${{ !cancelled() }}
        working-directory: alert-service
        run: mvn -B test -Dtest='OpenApiDocumentationTest' -Dsurefire.failIfNoSpecifiedTests=false

  dashboard:
    name: dashboard (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 21 requires ^20.19 || ^22.12 || >=24. Pinned to the major the
          # project was built and tested on rather than "latest", so a new Node
          # release cannot break the build without anyone changing a file.
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # --legacy-peer-deps because npm 10.9 crashes resolving the vitest peer
      # graph ("Cannot read properties of null (reading edgesOut)"). The lock
      # file was produced the same way, so `ci` is still reproducible.
      - name: Install
        working-directory: dashboard
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Format check
        if: ${{ !cancelled() }}
        working-directory: dashboard
        run: npm run format:check

      # Vitest with jsdom, which is what Angular 21 scaffolds -- not Karma.
      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: dashboard
        run: npm run test:ci

      - name: Production build
        if: ${{ !cancelled() }}
        working-directory: dashboard
        run: npm run build:prod

  contracts:
    name: contracts (JSON Schema validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator
        run: pip install "jsonschema>=4.21,<5.0"

      # Guards the contract files on their own, independently of the Python
      # library: a malformed schema silently validates everything, which is
      # worse than having no schema at all.
      - name: Check every schema is a valid Draft 2020-12 schema
        run: |
          python - <<'PY'
          import json, pathlib, sys
          from jsonschema import Draft202012Validator

          failures = []
          schemas = sorted(pathlib.Path("contracts/json-schema").glob("*.json"))
          if not schemas:
              sys.exit("no contract schema found")
          for path in schemas:
              try:
                  Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
                  print(f"ok   {path}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  print(f"FAIL {path}: {exc}")
          if failures:
              sys.exit(1)
          PY

  infra:
    name: infra (compose and topic script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the committed template
        # .env is git-ignored; CI uses the template so the compose file is
        # validated with exactly the variables a developer would have.
        run: cp .env.example .env

      - name: Validate the compose file resolves
        # `config` interpolates every variable and fails on an unset one, which
        # catches a variable added to compose but forgotten in .env.example.
        run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet

      # A variable declared in the template and interpolated by nothing reads
      # like configuration, gets edited, and changes nothing. This makes that
      # class of drift a build failure.
      - name: .env.example and compose agree on every variable
        if: ${{ !cancelled() }}
        run: python scripts/check_env_example.py

      - name: Shellcheck every shell script
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh infra/kafka/create-topics.sh
          shellcheck --shell=sh scripts/bootstrap.sh scripts/demo.sh
          shellcheck --shell=sh dashboard/docker-entrypoint.sh

  images:
    name: images (every Dockerfile builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the committed template
        run: cp .env.example .env

      # Three images run unprivileged and one declares a HEALTHCHECK. Those
      # properties fail at BUILD or at START, not in any unit test: an nginx
      # that cannot write its pid file, or a Spark job whose Ivy cache landed
      # in an unreadable /root, is a green test suite and a dead container.
      - name: Build every image
        run: docker compose --env-file .env -f infra/docker-compose.yml --profile sim --profile stream build

      # Building proves the Dockerfile is valid; it does not prove the image
      # runs as the user it declares. This does.
      - name: The hardened images really run unprivileged
        run: |
          set -eu
          for image in dashboard event-simulator stream-processor alert-service; do
            full="anomaly-platform/$image:dev"
            user=$(docker image inspect "$full" --format '{{.Config.User}}')
            if [ -z "$user" ]; then
              echo "FAIL $image runs as root: no USER directive took effect"
              exit 1
            fi
            echo "ok   $image runs as $user"
          done
